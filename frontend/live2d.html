<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OtakuCopilot — Live2D</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1117; font-family: 'Noto Sans SC', sans-serif; }

    #live2d-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    /* ── Subtitle overlay ── */
    #subtitle-wrap {
      position: fixed; bottom: 48px; left: 50%; transform: translateX(-50%);
      z-index: 100; max-width: 80%; pointer-events: none; text-align: center;
    }
    #subtitle {
      display: inline-block; padding: 12px 28px; border-radius: 16px;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(12px);
      color: #f0f0f0; font-size: 18px; line-height: 1.6; letter-spacing: 0.3px;
      opacity: 0; transition: opacity 0.4s ease;
    }
    #subtitle.visible { opacity: 1; }

    /* ── Emotion badge ── */
    #emotion-badge {
      position: fixed; top: 20px; right: 24px; z-index: 100;
      padding: 6px 18px; border-radius: 20px;
      background: rgba(0,200,150,0.2); backdrop-filter: blur(8px);
      color: #66ffcc; font-size: 14px; font-weight: 500; letter-spacing: 1px;
      opacity: 0; transition: opacity 0.3s ease;
    }
    #emotion-badge.visible { opacity: 1; }

    /* ── Status indicator ── */
    #status {
      position: fixed; top: 20px; left: 24px; z-index: 100;
      padding: 4px 14px; border-radius: 12px; font-size: 12px;
      background: rgba(0,0,0,0.4); color: #888; backdrop-filter: blur(6px);
    }
    #status.connected { color: #66ffcc; }
    #status.speaking  { color: #ffaa44; }

    /* ── Floating control panel ── */
    #ctrl-toggle {
      position: fixed; bottom: 16px; right: 16px; z-index: 200;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.12); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15); color: #ccc;
      font-size: 20px; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.2s;
    }
    #ctrl-toggle:hover { background: rgba(255,255,255,0.22); transform: scale(1.1); }

    #ctrl-panel {
      position: fixed; bottom: 68px; right: 16px; z-index: 200;
      width: 240px; padding: 16px 18px;
      background: rgba(15,18,25,0.85); backdrop-filter: blur(16px);
      border-radius: 16px; border: 1px solid rgba(255,255,255,0.08);
      color: #ddd; font-size: 13px;
      transform: translateY(8px); opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    #ctrl-panel.open { opacity: 1; transform: translateY(0); pointer-events: all; }

    #ctrl-panel label {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; gap: 8px;
    }
    #ctrl-panel label span { flex-shrink: 0; min-width: 52px; }
    #ctrl-panel label small { color: #888; min-width: 36px; text-align: right; font-size: 12px; }

    #ctrl-panel input[type=range] {
      flex: 1; height: 4px; -webkit-appearance: none; appearance: none;
      background: rgba(255,255,255,0.15); border-radius: 2px; outline: none;
    }
    #ctrl-panel input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
      background: #66ffcc; cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="live2d-canvas"></canvas>
  <div id="subtitle-wrap"><div id="subtitle"></div></div>
  <div id="emotion-badge"></div>
  <div id="status">connecting...</div>

  <!-- Floating controls -->
  <div id="ctrl-toggle" onclick="toggleCtrlPanel()" title="settings">&#9881;</div>
  <div id="ctrl-panel">
    <label>
      <span>Model Scale</span>
      <input type="range" id="scale-slider" min="0.05" max="1.0" step="0.01" value="0.3"
             oninput="onScaleChange(this.value)">
      <small id="scale-val">0.30</small>
    </label>
    <label>
      <span>Volume</span>
      <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1"
             oninput="onVolumeChange(this.value)">
      <small id="volume-val">100%</small>
    </label>
  </div>

  <!-- Live2D Cubism 4 Core (must load first) -->
  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
  <!-- PixiJS v6 (compatible with pixi-live2d-display) -->
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
  <!-- pixi-live2d-display (Cubism 4) -->
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>

  <script>
    // ============================================================
    //  Global state
    // ============================================================
    let pixiApp = null;
    let currentModel = null;
    let audioContext = null;
    let gainNode = null;
    let lastAudioVersion = 0;   // initialized from backend on boot
    let isSpeaking = false;
    let currentEmotion = 'neutral';
    let modelConfig = null;
    let currentScale = 0.3;
    let currentVolume = 1.0;
    let mouthValue = 0;         // 0-1 amplitude, written by rAF, read by ticker
    let activeMouthParam = null;
    let lipSyncRafId = null;
    let activeSource = null;      // current AudioBufferSourceNode, for interrupting
    let activeSafetyTimeout = null;
    let emotionBadgeTimeout = null;
    let audioGeneration = 0;      // 防止新旧音频交错的计数器
    let isAudioPlaying = false;   // audio source has started — lip sync active

    const subtitleEl = document.getElementById('subtitle');
    const emotionEl  = document.getElementById('emotion-badge');
    const statusEl   = document.getElementById('status');

    // ============================================================
    //  Control panel
    // ============================================================
    function toggleCtrlPanel() {
      document.getElementById('ctrl-panel').classList.toggle('open');
    }

    function onScaleChange(val) {
      currentScale = parseFloat(val);
      document.getElementById('scale-val').textContent = currentScale.toFixed(2);
      if (currentModel) {
        currentModel.scale.set(currentScale);
      }
    }

    function onVolumeChange(val) {
      currentVolume = parseFloat(val);
      document.getElementById('volume-val').textContent = Math.round(currentVolume * 100) + '%';
      if (gainNode) gainNode.gain.value = currentVolume;
    }

    // ============================================================
    //  Emotion parameter mapping
    // ============================================================
    const ALL_EMOTION_PARAM_IDS = ['Param4', 'Param5', 'Param8'];
    const DEFAULT_EMOTION_PARAMS = {
      neutral: {},
      joy:      { Param8: 1 },
      sadness:  { Param4: 1 },
      anger:    { Param5: 1 },
      surprise: { Param4: 1 },
      fear:     { Param4: 1 },
      disgust:  { Param5: 1 },
      smirk:    { Param8: 1 }
    };

    function getEmotionParams(emotion) {
      const cfg = (modelConfig && modelConfig.emotionParams) || {};
      const merged = { ...DEFAULT_EMOTION_PARAMS };
      for (const [e, vals] of Object.entries(cfg)) {
        merged[e] = { ...(merged[e] || {}), ...vals };
      }
      return merged[emotion.toLowerCase()] || {};
    }

    // ============================================================
    //  1. PixiJS init
    // ============================================================
    function initPixi() {
      pixiApp = new PIXI.Application({
        view: document.getElementById('live2d-canvas'),
        resizeTo: window,
        backgroundAlpha: 0,
        antialias: true,
        autoDensity: true,
        resolution: window.devicePixelRatio || 1,
      });
    }

    // ============================================================
    //  2. Model loading
    // ============================================================
    async function loadModel(modelUrl, config) {
      if (currentModel) {
        pixiApp.stage.removeChild(currentModel);
        currentModel.destroy();
        currentModel = null;
      }

      try {
        const model = await PIXI.live2d.Live2DModel.from(modelUrl, { autoInteract: false });

        const scale = config.kScale || config.scale || 0.3;
        currentScale = scale;
        model.scale.set(scale);
        model.anchor.set(0.5, 0.5);
        model.x = pixiApp.screen.width / 2 + (config.initialXshift || 0);
        model.y = pixiApp.screen.height / 2 + (config.initialYshift || 0);

        document.getElementById('scale-slider').value = scale;
        document.getElementById('scale-val').textContent = scale.toFixed(2);

        model.interactive = true;
        pixiApp.stage.addChild(model);
        currentModel = model;

        // Detect mouth parameter for this model
        activeMouthParam = null;
        detectMouthParam();

        // Register the per-frame state updater
        registerStateUpdater(model);

        // Apply presets once
        applyPresets(model);

        // Start idle motion
        const idleGroup = config.idleMotionGroupName || 'Idle';
        try { model.motion(idleGroup, 0, 'idle'); } catch (e) {}

        statusEl.textContent = 'connected';
        statusEl.className = 'connected';
      } catch (err) {
        statusEl.textContent = 'model error';
        console.error('[live2d] Failed to load model:', err);
      }
    }

    function applyPresets(model) {
      if (!modelConfig) return;
      const core = model.internalModel.coreModel;

      if (modelConfig.presets) {
        for (const [pId, pVal] of Object.entries(modelConfig.presets)) {
          try { core.setParameterValueById(pId, pVal); } catch (e) {}
        }
      }
      if (modelConfig.presetParts) {
        for (const [partId, opacity] of Object.entries(modelConfig.presetParts)) {
          try {
            const idx = core.getPartIndex(partId);
            if (idx >= 0) core.setPartOpacityByIndex(idx, opacity);
          } catch (e) {}
        }
      }
    }

    // ============================================================
    //  3. Mouse tracking
    // ============================================================
    function setupMouseTracking() {
      const canvas = pixiApp.view;

      window.addEventListener('mousemove', (e) => {
        if (!currentModel) return;
        const rect = canvas.getBoundingClientRect();
        currentModel.focus(e.clientX - rect.left, e.clientY - rect.top);
      });

      // Touch support for mobile — character follows finger
      canvas.addEventListener('touchstart', (e) => {
        if (!currentModel || !e.touches.length) return;
        const rect = canvas.getBoundingClientRect();
        const t = e.touches[0];
        currentModel.focus(t.clientX - rect.left, t.clientY - rect.top);
      }, { passive: true });

      canvas.addEventListener('touchmove', (e) => {
        if (!currentModel || !e.touches.length) return;
        const rect = canvas.getBoundingClientRect();
        const t = e.touches[0];
        currentModel.focus(t.clientX - rect.left, t.clientY - rect.top);
      }, { passive: true });
    }

    // ============================================================
    //  4. Mouth parameter detection
    // ============================================================
    const MOUTH_PARAMS = ['ParamMouthOpenY', 'PARAM_MOUTH_OPEN_Y', 'ParamMouthOpen', 'Param_MouthOpenY'];

    function detectMouthParam() {
      if (!currentModel) return null;
      if (activeMouthParam) return activeMouthParam;

      try {
        const core = currentModel.internalModel.coreModel;
        // Log all parameter IDs for debugging
        try {
          const paramCount = core.getParameterCount();
          const mouthRelated = [];
          for (let i = 0; i < paramCount; i++) {
            const id = core.getParameterId(i);
            if (id && id.toLowerCase().includes('mouth')) {
              mouthRelated.push(`${id}=${core.getParameterValue(i)}`);
            }
          }
          console.log('[detectMouth] mouth-related params:', mouthRelated.join(', ') || '(none)');
        } catch (e) { console.log('[detectMouth] could not enumerate params:', e.message); }

        for (const p of MOUTH_PARAMS) {
          try {
            core.setParameterValueById(p, 0);
            activeMouthParam = p;
            console.log('[detectMouth] using:', p);
            return p;
          } catch (e) {}
        }
      } catch (e) {}

      activeMouthParam = MOUTH_PARAMS[0];
      console.log('[detectMouth] fallback to:', activeMouthParam);
      return activeMouthParam;
    }

    // ============================================================
    //  5. Audio + lip sync
    // ============================================================
    function ensureAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        gainNode = audioContext.createGain();
        gainNode.gain.value = currentVolume;
        gainNode.connect(audioContext.destination);
      }
    }

    let subtitleHideTimeout = null;

    async function playAudioWithLipSync(audioUrl) {
      // If already speaking, stop old audio first to allow new audio to take over
      if (isSpeaking) {
        stopSpeaking();
      }

      // 递增 generation，如果 decode 期间有新的音频请求，旧的会自动放弃
      const myGen = ++audioGeneration;
      isSpeaking = true;
      isAudioPlaying = false;   // will be set to true once source.start()
      mouthValue = 0;
      statusEl.textContent = 'loading audio...';
      statusEl.className = 'speaking';

      try {
        // Ensure AudioContext exists and is running
        ensureAudioContext();
        if (audioContext.state === 'suspended') {
          try { await audioContext.resume(); } catch (e) {}
        }
        if (audioContext.state !== 'running') {
          console.warn('[live2d] AudioContext not running — tap the page first');
          stopSpeaking();
          return;
        }
        detectMouthParam();

        const response = await fetch(audioUrl);
        if (!response.ok) { stopSpeaking(); return; }
        const arrayBuffer = await response.arrayBuffer();
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

        // 如果在 decode 期间有新的音频请求，放弃这次播放
        if (audioGeneration !== myGen) return;

        // 直接从 AudioBuffer 的 PCM 样本计算振幅，不依赖 AnalyserNode
        const pcmData = audioBuffer.getChannelData(0); // float32 [-1, 1]
        const sampleRate = audioBuffer.sampleRate;
        const windowSize = Math.floor(sampleRate * 0.03); // 30ms 窗口

        const source = audioContext.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(gainNode);

        // Track active nodes so stopSpeaking() can interrupt them
        activeSource = source;

        // Cancel previous lip sync loop
        if (lipSyncRafId !== null) {
          cancelAnimationFrame(lipSyncRafId);
          lipSyncRafId = null;
        }

        const startTime = audioContext.currentTime;
        source.start(0);
        isAudioPlaying = true;
        statusEl.textContent = 'speaking';
        console.log('[lip-sync] source started, duration:', audioBuffer.duration.toFixed(2), 's, samples:', pcmData.length);

        // Safety timeout
        activeSafetyTimeout = setTimeout(() => {
          if (audioGeneration === myGen) stopSpeaking();
        }, Math.max(2000, audioBuffer.duration * 1000 + 2000));

        // Lip sync rAF loop: 直接读 PCM 样本
        let smoothed = 0;
        let _dbgFrameCount = 0;

        function updateMouth() {
          if (!isSpeaking || audioGeneration !== myGen) { lipSyncRafId = null; return; }

          // 根据当前播放时间计算样本位置
          const elapsed = audioContext.currentTime - startTime;
          const samplePos = Math.floor(elapsed * sampleRate);
          const halfWin = Math.floor(windowSize / 2);
          const start = Math.max(0, samplePos - halfWin);
          const end = Math.min(pcmData.length, samplePos + halfWin);

          // 计算窗口内 RMS
          let sumSq = 0;
          let count = 0;
          let minS = 1, maxS = -1;
          for (let i = start; i < end; i++) {
            const v = pcmData[i];
            if (v < minS) minS = v;
            if (v > maxS) maxS = v;
            sumSq += v * v;
            count++;
          }
          const raw = count > 0 ? Math.sqrt(sumSq / count) : 0;
          // 上升快（0.4）、下降快（0.6）—— 嘴巴张开迅速，闭合也迅速
          const alpha = raw > smoothed ? 0.4 : 0.6;
          smoothed += (raw - smoothed) * alpha;
          // 非线性映射：用 pow 压缩峰值，限制在 0.05 ~ 0.55 范围
          const normalized = Math.min(1, smoothed * 3.0);
          mouthValue = 0.05 + Math.pow(normalized, 0.7) * 0.50;

          if (_dbgFrameCount < 10 || _dbgFrameCount % 60 === 0) {
            console.log(`[lip-sync] frame=${_dbgFrameCount} pos=${samplePos}/${pcmData.length} min=${minS.toFixed(3)} max=${maxS.toFixed(3)} raw=${raw.toFixed(4)} smoothed=${smoothed.toFixed(4)} mouth=${mouthValue.toFixed(3)}`);
          }
          _dbgFrameCount++;

          lipSyncRafId = requestAnimationFrame(updateMouth);
        }
        lipSyncRafId = requestAnimationFrame(updateMouth);

        source.onended = () => {
          if (audioGeneration === myGen) {
            if (activeSafetyTimeout) clearTimeout(activeSafetyTimeout);
            stopSpeaking();
          }
          source.disconnect();
        };
      } catch (err) {
        console.error('[live2d] Audio error:', err);
        if (audioGeneration === myGen) stopSpeaking();
      }
    }

    function stopSpeaking() {
      isSpeaking = false;
      isAudioPlaying = false;
      mouthValue = 0;
      if (lipSyncRafId !== null) {
        cancelAnimationFrame(lipSyncRafId);
        lipSyncRafId = null;
      }
      if (activeSafetyTimeout) {
        clearTimeout(activeSafetyTimeout);
        activeSafetyTimeout = null;
      }
      // Stop the audio source if it's still playing
      if (activeSource) {
        try { activeSource.stop(); } catch (e) {}
        try { activeSource.disconnect(); } catch (e) {}
        activeSource = null;
      }
      // mouthValue = 0 已在上面设置，下一帧 beforeModelUpdate 事件会自动应用到模型
      statusEl.textContent = 'connected';
      statusEl.className = 'connected';
      // Hide subtitle after speaking ends (with a short delay so user can read it)
      if (subtitleHideTimeout) clearTimeout(subtitleHideTimeout);
      subtitleHideTimeout = setTimeout(() => showSubtitle(''), 2000);
    }

    // ============================================================
    //  6. Per-frame state updater (presets + emotion + lip sync)
    // ============================================================
    let _coreErrorCount = 0;
    let _dbgTickerCount = 0;

    function _applyOverrides(core) {
      // 1. Presets (cat ears, hair)
      if (modelConfig && modelConfig.presets) {
        for (const [pId, pVal] of Object.entries(modelConfig.presets)) {
          try { core.setParameterValueById(pId, pVal); } catch (e) {
            _coreErrorCount++;
          }
        }
      }

      // 2. Emotion params — only override for non-neutral emotions
      if (currentEmotion && currentEmotion !== 'neutral') {
        const emoParams = getEmotionParams(currentEmotion);
        for (const pId of ALL_EMOTION_PARAM_IDS) {
          if (modelConfig && modelConfig.presets && pId in modelConfig.presets) continue;
          const val = emoParams[pId] || 0;
          try { core.setParameterValueById(pId, val); } catch (e) {
            _coreErrorCount++;
          }
        }
      }

      // 3. Part opacities
      if (modelConfig && modelConfig.presetParts) {
        for (const [partId, opacity] of Object.entries(modelConfig.presetParts)) {
          try {
            const idx = core.getPartIndex(partId);
            if (idx >= 0) core.setPartOpacityByIndex(idx, opacity);
          } catch (e) {
            _coreErrorCount++;
          }
        }
      }

      // 4. Lip sync (mouth)
      if (isAudioPlaying && activeMouthParam) {
        const effectiveMouth = window.debugMouthTest
          ? (Math.sin(Date.now() / 100) * 0.5 + 0.5)
          : mouthValue;
        try {
          core.setParameterValueById(activeMouthParam, effectiveMouth);
          if (_dbgTickerCount < 5 || _dbgTickerCount % 120 === 0) {
            console.log(`[override] ${activeMouthParam}=${effectiveMouth.toFixed(3)} emo=${currentEmotion} speaking=${isAudioPlaying}`);
          }
          _dbgTickerCount++;
        } catch (e) {
          _coreErrorCount++;
        }
      }

      // Debug: 测试眼睛
      if (window.debugMouthTest) {
        try {
          const eyeVal = Math.sin(Date.now() / 200) * 0.5 + 0.5;
          core.setParameterValueById('ParamEyeLOpen', eyeVal);
          core.setParameterValueById('ParamEyeROpen', eyeVal);
        } catch (e) {}
      }

      if (_coreErrorCount > 300) {
        _coreErrorCount = 0;
        activeMouthParam = null;
        detectMouthParam();
      }
    }

    function registerStateUpdater(model) {
      if (!model) return;

      const core = model.internalModel.coreModel;
      const internalModel = model.internalModel;

      // ── Listen for beforeModelUpdate event ──
      // This fires RIGHT BEFORE model.update() computes vertices,
      // after motion/expressions/physics have set their params.
      // Our overrides will be included in the vertex computation.
      let _frameCount = 0;
      internalModel.on('beforeModelUpdate', () => {
        _applyOverrides(core);
        _frameCount++;
        if (_frameCount <= 5 || _frameCount % 300 === 0) {
          const mouthIdx = core.getParameterIndex('ParamMouthOpenY');
          console.log(`[beforeModelUpdate #${_frameCount}] mouth=${core.getParameterValueByIndex(mouthIdx).toFixed(3)} isAudio=${isAudioPlaying} mouthVal=${mouthValue.toFixed(3)}`);
        }
      });

      // 列出 coreModel 所有方法
      const methods = [];
      let obj = core;
      while (obj && obj !== Object.prototype) {
        for (const key of Object.getOwnPropertyNames(obj)) {
          if (typeof core[key] === 'function') methods.push(key);
        }
        obj = Object.getPrototypeOf(obj);
      }
      console.log('[registerStateUpdater] coreModel methods:', methods.sort().join(', '));
      console.log('[registerStateUpdater] patched core.update and internalModel.draw');

      // Expose core reference for console debugging
      window._live2dCore = core;
      window._live2dInternalModel = internalModel;
    }

    // Global vertex test — call testVertex() from browser console
    window.testVertex = function() {
      const core = window._live2dCore;
      if (!core) { console.error('No core loaded yet'); return; }

      console.log('=== testVertex START ===');

      // 1. Read current mouth param
      const mouthIdx = core.getParameterIndex('ParamMouthOpenY');
      console.log('ParamMouthOpenY index:', mouthIdx);
      console.log('ParamMouthOpenY value BEFORE:', core.getParameterValueByIndex(mouthIdx));

      // 2. Read some vertex positions BEFORE
      const numDrawables = core.getDrawableCount();
      console.log('Drawable count:', numDrawables);

      // Find drawables that have mouth-related vertices
      // Just sample first few drawables
      const sampleCount = Math.min(numDrawables, 5);
      const vertsBefore = [];
      for (let i = 0; i < sampleCount; i++) {
        const verts = core.getDrawableVertexPositions(i);
        vertsBefore.push(verts.slice(0, 10)); // first 10 values (5 vertices)
      }
      console.log('Verts BEFORE (first 5 drawables, first 5 verts each):', vertsBefore);

      // 3. Set mouth to max
      core.setParameterValueById('ParamMouthOpenY', 1.0);
      console.log('Set ParamMouthOpenY to 1.0, readback:', core.getParameterValueByIndex(mouthIdx));

      // 4. Also try by index
      core.setParameterValueByIndex(mouthIdx, 1.0);
      console.log('Also set by index, readback:', core.getParameterValueByIndex(mouthIdx));

      // 5. Call update
      try {
        core.update();
        console.log('core.update() called OK');
      } catch (e) {
        console.error('core.update() error:', e);
      }

      // 6. Read vertices AFTER
      const vertsAfter = [];
      for (let i = 0; i < sampleCount; i++) {
        const verts = core.getDrawableVertexPositions(i);
        vertsAfter.push(verts.slice(0, 10));
      }
      console.log('Verts AFTER (first 5 drawables, first 5 verts each):', vertsAfter);

      // 7. Compare
      let anyChanged = false;
      for (let i = 0; i < sampleCount; i++) {
        for (let j = 0; j < vertsBefore[i].length; j++) {
          if (Math.abs(vertsBefore[i][j] - vertsAfter[i][j]) > 0.0001) {
            anyChanged = true;
            console.log(`  CHANGED: drawable[${i}] vert[${j}]: ${vertsBefore[i][j]} -> ${vertsAfter[i][j]}`);
          }
        }
      }
      if (!anyChanged) {
        console.warn('!!! NO VERTEX CHANGED after setParamValueById + update() !!!');
        console.log('Trying saveParameters/loadParameters approach...');

        // Try save/load approach
        core.saveParameters();
        core.setParameterValueById('ParamMouthOpenY', 1.0);
        core.update();
        const vertsAfter2 = [];
        for (let i = 0; i < sampleCount; i++) {
          vertsAfter2.push(core.getDrawableVertexPositions(i).slice(0, 10));
        }
        let changed2 = false;
        for (let i = 0; i < sampleCount; i++) {
          for (let j = 0; j < vertsBefore[i].length; j++) {
            if (Math.abs(vertsBefore[i][j] - vertsAfter2[i][j]) > 0.0001) {
              changed2 = true;
              console.log(`  save/load CHANGED: drawable[${i}] vert[${j}]: ${vertsBefore[i][j]} -> ${vertsAfter2[i][j]}`);
            }
          }
        }
        if (!changed2) console.warn('!!! save/load ALSO produced no vertex changes !!!');
      } else {
        console.log('SUCCESS: vertices DID change!');
      }

      // 8. Reset mouth
      core.setParameterValueById('ParamMouthOpenY', 0);
      core.setParameterValueByIndex(mouthIdx, 0);
      core.update();
      console.log('=== testVertex END ===');
    };

    // Quick check: list all parameter IDs and their current values
    window.listParams = function() {
      const core = window._live2dCore;
      if (!core) { console.error('No core loaded yet'); return; }
      const count = core.getParameterCount();
      console.log(`Parameters (${count}):`);
      for (let i = 0; i < count; i++) {
        const id = core.getParameterId(i);
        const val = core.getParameterValueByIndex(i);
        const min = core.getParameterMinimumValue(i);
        const max = core.getParameterMaximumValue(i);
        console.log(`  [${i}] ${id} = ${val.toFixed(3)} (range: ${min}~${max})`);
      }
    };

    // ============================================================
    //  7. Emotion + subtitle
    // ============================================================
    function applyEmotion(emotion) {
      currentEmotion = emotion;
      emotionEl.textContent = emotion;
      emotionEl.className = 'visible';
      if (emotionBadgeTimeout) clearTimeout(emotionBadgeTimeout);
      emotionBadgeTimeout = setTimeout(() => { emotionEl.className = ''; }, 3000);
    }

    function showSubtitle(text) {
      if (!text) {
        subtitleEl.className = '';
        return;
      }
      subtitleEl.textContent = text;
      subtitleEl.className = 'visible';
    }

    // ============================================================
    //  8. State polling
    // ============================================================

    async function pollState() {
      try {
        const res = await fetch('/api/live2d/state');
        if (!res.ok) return;
        const state = await res.json();

        if (state.audio_version > lastAudioVersion) {
          lastAudioVersion = state.audio_version;
          if (state.emotion) applyEmotion(state.emotion);
          showSubtitle(state.reply_text || '');
          if (subtitleHideTimeout) clearTimeout(subtitleHideTimeout);
          await playAudioWithLipSync(`/api/live2d/audio?v=${state.audio_version}`);
        }
      } catch (e) {}
    }

    // ============================================================
    //  9. Window resize
    // ============================================================
    function setupResize() {
      window.addEventListener('resize', () => {
        if (currentModel && modelConfig) {
          currentModel.x = pixiApp.screen.width / 2 + (modelConfig.initialXshift || 0);
          currentModel.y = pixiApp.screen.height / 2 + (modelConfig.initialYshift || 0);
        }
      });
    }

    // ============================================================
    //  10. Boot
    // ============================================================
    async function boot() {
      initPixi();
      setupMouseTracking();
      setupResize();

      // Fetch model config
      try {
        const res = await fetch('/api/live2d/models');
        if (!res.ok) throw new Error('Failed to fetch models');
        const data = await res.json();

        if (data.current && data.current.url) {
          modelConfig = data.current;
        } else if (data.models && data.models.length > 0) {
          modelConfig = data.models[0];
        }

        if (modelConfig) {
          await loadModel(modelConfig.url, modelConfig);
        } else {
          statusEl.textContent = 'no model found';
        }
      } catch (err) {
        statusEl.textContent = 'error';
        console.error('[live2d] Boot error:', err);
      }

      // Initialize volume from backend TTS config
      try {
        const cfgRes = await fetch('/api/config');
        if (cfgRes.ok) {
          const cfg = await cfgRes.json();
          const vol = cfg.tts?.volume;
          if (vol !== undefined && vol !== null) {
            currentVolume = parseFloat(vol);
            if (gainNode) gainNode.gain.value = currentVolume;
            document.getElementById('volume-slider').value = currentVolume;
            document.getElementById('volume-val').textContent = Math.round(currentVolume * 100) + '%';
          }
        }
      } catch (e) {}

      // Initialize lastAudioVersion from backend to prevent replaying old audio on refresh
      try {
        const res = await fetch('/api/live2d/state');
        if (res.ok) {
          const state = await res.json();
          lastAudioVersion = state.audio_version || 0;
        }
      } catch (e) {}

      // Start polling (500ms interval — responsive enough, 2 req/s instead of 3.3)
      setInterval(pollState, 500);
    }

    // AudioContext activation: create immediately, resume on first user gesture
    // if browser blocks autoplay
    function activateAudio() {
      ensureAudioContext();
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
    }
    window.addEventListener('pointerdown', activateAudio, { capture: true });
    window.addEventListener('touchstart', activateAudio, { capture: true, passive: true });
    window.addEventListener('keydown', activateAudio, { capture: true });
    window.addEventListener('DOMContentLoaded', () => {
      // Proactively create AudioContext (may start suspended until user gesture)
      ensureAudioContext();
      boot();
    });
  </script>
</body>
</html>
